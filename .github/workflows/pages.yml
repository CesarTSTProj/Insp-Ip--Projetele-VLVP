name: Publicar INSP

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Baixar produção
        uses: actions/checkout@v6
        with:
          ref: main
          path: producao


      - name: Baixar homologação
        uses: actions/checkout@v6
        with:
          ref: develop
          path: desenvolvimento


      - name: Montar publicação
        run: |
          mkdir -p public

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            producao/ \
            public/

          mkdir -p public/homolog

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            desenvolvimento/ \
            public/homolog/


      - name: Configurar Pages
        uses: actions/configure-pages@v5


      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: public


      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
